[package]
name        = "keb"
version     = "0.3.0"
edition     = "2024"
rust-version = "1.85"
description = "Rename files to kebab case, safely and idempotently"
license     = "MIT"
repository  = "https://github.com/frycz/keb"
homepage    = "https://github.com/frycz/keb"
readme      = "README.md"
keywords    = ["kebab-case", "rename", "filename", "slug", "cli"]
categories  = ["command-line-utilities", "filesystem", "text-processing"]
exclude     = ["design/", "demo/", "publish.md", "next-steps.md", "atm.json", ".github/"]

[lib]
name = "keb"
path = "src/lib.rs"

[[bin]]
name              = "keb"
path              = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli     = ["dep:clap"]

[dependencies]
# CLI layer only — gated so library consumers get the transform alone:
#   cargo add keb --no-default-features
clap = { version = "4", features = ["derive"], optional = true }

# Transform layer — the pipeline in design/cases.md §9:
#   NFKC and NFD (steps 3, 5), and the combining-mark test
unicode-normalization = "0.1"
#   grapheme-safe truncation (step 11)
unicode-segmentation = "1"

# The filesystem layer (design/cases.md §6-7, §12) needs no dependencies: traversal is
# `read_dir`, the journal is a flat file, and `git mv` is a subprocess. Transliteration
# is hand-written rather than pulled from `deunicode`, because decision 2 romanizes
# only the scripts where that is deterministic and keeps the rest verbatim.

[[test]]
name              = "generated"
required-features = ["cli"]

[dev-dependencies]
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
proptest = "1"
roff = "1.1.1"

# .deb and .rpm release assets, built by .github/workflows/linux-packages.yml from the
# Release's own Linux binaries. `target/release/keb` is rewritten to
# `target/<triple>/release/keb` when a --target is passed. Zsh looks in a different
# vendor directory on Debian than on Fedora; the rest of the layout is shared.
[package.metadata.deb]
maintainer           = "Adam Sawicki <frycz.dev@gmail.com>"
copyright            = "2026, Adam Sawicki"
section              = "utils"
priority             = "optional"
extended-description = """\
keb renames files so their names are kebab case: lowercase words joined by hyphens. \
It keeps compound extensions, versions and hashes intact, transliterates scripts only \
where that is deterministic, suffixes collisions instead of overwriting, and skips \
names that build tools look up literally."""
assets = [
    ["target/release/keb", "usr/bin/", "755"],
    ["man/keb.1", "usr/share/man/man1/keb.1", "644"],
    ["completions/keb.bash", "usr/share/bash-completion/completions/keb", "644"],
    ["completions/_keb", "usr/share/zsh/vendor-completions/_keb", "644"],
    ["completions/keb.fish", "usr/share/fish/vendor_completions.d/keb.fish", "644"],
    ["README.md", "usr/share/doc/keb/README.md", "644"],
]

[package.metadata.generate-rpm]
summary = "Rename files to kebab case, safely and idempotently"
assets = [
    { source = "target/release/keb", dest = "/usr/bin/keb", mode = "755" },
    { source = "man/keb.1", dest = "/usr/share/man/man1/keb.1", mode = "644", doc = true },
    { source = "completions/keb.bash", dest = "/usr/share/bash-completion/completions/keb", mode = "644" },
    { source = "completions/_keb", dest = "/usr/share/zsh/site-functions/_keb", mode = "644" },
    { source = "completions/keb.fish", dest = "/usr/share/fish/vendor_completions.d/keb.fish", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/keb/README.md", mode = "644", doc = true },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/keb/LICENSE-MIT", mode = "644", doc = true },
]

[profile.release]
opt-level = 3
lto       = true
strip     = true

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "frycz/homebrew-tap"
# A namespace to use when publishing this package to the npm registry
npm-scope = "@frycz"
# Publish jobs to run in CI
publish-jobs = ["homebrew", "npm", "./linux-packages"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Extra static files to include in each App (path relative to this Cargo.toml's dir)
include = ["completions/", "man/"]
github-custom-job-permissions = { "linux-packages" = { contents = "write" } }

[profile.dist]
inherits = "release"
