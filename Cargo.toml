[package]
name        = "keb"
version     = "0.1.0"
edition     = "2024"
rust-version = "1.85"
description = "Rename files to kebab case, safely and idempotently"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/frycz/keb"
homepage    = "https://github.com/frycz/keb"
readme      = "README.md"
keywords    = ["kebab-case", "rename", "filename", "slug", "cli"]
categories  = ["command-line-utilities", "filesystem", "text-processing"]
exclude     = ["design/", "publish.md", "atm.json", ".github/"]

[lib]
name = "keb"
path = "src/lib.rs"

[[bin]]
name              = "keb"
path              = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli     = ["dep:clap"]

[dependencies]
# CLI layer only — gated so library consumers get the transform alone:
#   cargo add keb --no-default-features
clap = { version = "4", features = ["derive"], optional = true }

# Transform layer — the pipeline in design/cases.md §9:
#   NFKC and NFD (steps 3, 5), and the combining-mark test
unicode-normalization = "0.1"
#   grapheme-safe truncation (step 11)
unicode-segmentation = "1"

# The filesystem layer (design/cases.md §6-7, §12) needs no dependencies: traversal is
# `read_dir`, the journal is a flat file, and `git mv` is a subprocess. Transliteration
# is hand-written rather than pulled from `deunicode`, because decision 2 romanizes
# only the scripts where that is deterministic and keeps the rest verbatim.

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto       = true
strip     = true

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "frycz/homebrew-tap"
# A namespace to use when publishing this package to the npm registry
npm-scope = "@frycz"
# Publish jobs to run in CI
publish-jobs = ["homebrew", "npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

[profile.dist]
inherits = "release"
